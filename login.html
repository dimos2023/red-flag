<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Red Flag</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <span class="logo-icon">🚩</span>
                    <span class="logo-text">Red Flag</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="auth-page">
        <div class="container">
            <div class="auth-card">
                <a href="index.html" class="back-link">← Back to Home</a>

                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-description">
                    Sign in to your account to continue
                </p>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            name="email" 
                            class="form-input" 
                            placeholder="john@example.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            name="password" 
                            class="form-input" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        Sign In
                    </button>

                    <p class="auth-footer">
                        Don't have an account? 
                        <a href="register.html" class="auth-link">Create one</a>
                    </p>
                </form>

                <!-- Demo Credentials -->
                <div class="demo-credentials">
                    <h3 class="demo-title">Demo Credentials</h3>
                    <p class="demo-text">For testing purposes:</p>
                    <div class="demo-info">
                        <strong>User:</strong> user@test.com / password123<br>
                        <strong>Admin:</strong> admin@test.com / admin123
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-copyright">
                © <span id="currentYear"></span> Red Flag. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
